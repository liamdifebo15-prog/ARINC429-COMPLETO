services:
  mysql:
    image: mysql:8.4
    container_name: arinc429-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: arinc429
      MYSQL_USER: arinc_user
      MYSQL_PASSWORD: arinc_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_only"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
